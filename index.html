<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>儿童房3D布局预览工具</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>
    
    <div id="ui-container">
      <div id="header">
        <h1>🎨 儿童房3D布局预览</h1>
        <div class="header-actions">
          <button id="reset-btn" class="btn btn-secondary">重置场景</button>
          <button id="export-btn" class="btn btn-primary">📸 导出图片</button>
        </div>
      </div>

      <div id="control-panel">
        <div class="panel-section">
          <h3>🏠 房间设置</h3>
          <div class="control-row">
            <label>房间长度 (米)</label>
            <input type="range" id="room-length" min="3" max="8" step="0.5" value="5">
            <span id="room-length-value">5.0</span>
          </div>
          <div class="control-row">
            <label>房间宽度 (米)</label>
            <input type="range" id="room-width" min="3" max="8" step="0.5" value="4">
            <span id="room-width-value">4.0</span>
          </div>
          <div class="control-row">
            <label>房间高度 (米)</label>
            <input type="range" id="room-height" min="2.4" max="3.6" step="0.1" value="2.8">
            <span id="room-height-value">2.8</span>
          </div>
        </div>

        <div class="panel-section">
          <h3>🎨 装修风格</h3>
          <div class="style-buttons">
            <button class="style-btn active" data-style="pinkPrincess">🌸 粉色公主</button>
            <button class="style-btn" data-style="blueOcean">🌊 蓝色海洋</button>
            <button class="style-btn" data-style="greenForest">🌲 绿色森林</button>
            <button class="style-btn" data-style="yellowSun">☀️ 阳光童趣</button>
            <button class="style-btn" data-style="starryNight">⭐ 星空梦幻</button>
          </div>
        </div>

        <div class="panel-section">
          <h3>🖌️ 颜色定制</h3>
          <div class="control-row">
            <label>墙面颜色</label>
            <input type="color" id="wall-color" value="#FFE4E1">
          </div>
          <div class="control-row">
            <label>地板颜色</label>
            <input type="color" id="floor-color" value="#DEB887">
          </div>
          <div class="control-row">
            <label>天花板颜色</label>
            <input type="color" id="ceiling-color" value="#FFFAF0">
          </div>
        </div>

        <div class="panel-section">
          <h3>🛏️ 添加家具</h3>
          <p class="tip">点击家具卡片添加到房间，拖拽移动位置</p>
          <div class="furniture-grid" id="furniture-grid">
          </div>
        </div>

        <div class="panel-section">
          <h3>💾 布局方案</h3>
          <div class="scheme-save-row">
            <input type="text" id="scheme-name-input" placeholder="输入方案名称" maxlength="20">
            <button id="save-scheme-btn" class="btn btn-save">💾 保存</button>
          </div>
          <div class="scheme-list" id="scheme-list">
            <div class="scheme-empty">暂无保存的方案</div>
          </div>
        </div>

        <div class="panel-section">
          <h3>🛠️ 操作说明</h3>
          <ul class="tips-list">
            <li>🖱️ 左键拖拽：旋转视角</li>
            <li>🖱️ 右键拖拽：平移视角</li>
            <li>🔍 滚轮：缩放</li>
            <li>👆 点击家具：选中</li>
            <li>✋ 拖拽家具：移动位置</li>
            <li>⌫ Delete：删除选中家具</li>
            <li>↩️ Ctrl+Z：撤销上一步操作</li>
          </ul>
        </div>
      </div>

      <div id="selected-info" class="hidden">
        <div class="selected-content">
          <span id="selected-name">未选中</span>
          <div class="selected-actions">
            <button id="rotate-left-btn" class="btn-icon" title="向左旋转">↺</button>
            <button id="rotate-right-btn" class="btn-icon" title="向右旋转">↻</button>
            <button id="delete-btn" class="btn-icon btn-danger" title="删除">🗑️</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
